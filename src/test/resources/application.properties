# Configuração usada só quando os testes rodam (src/test), nunca em produção.
# Usa H2 em memória em vez do MySQL real, pra testes serem rápidos e não
# dependerem de um banco de verdade rodando na máquina.
spring.datasource.url=jdbc:h2:mem:gerenciador_eventos_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Sem Flyway nos testes: o Hibernate cria o schema direto a partir das entidades
# (ddl-auto=create-drop). Ou seja, os testes não validam as migrações em si,
# só o comportamento da aplicação. Rodar a aplicação de verdade contra o MySQL
# continua sendo o jeito de garantir que as migrações (V1, V2) estão corretas.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

api.security.token.secret=segredo-apenas-para-testes
api.cors.allowed-origins=http://localhost:3000
